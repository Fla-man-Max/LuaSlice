name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout LuaSlice
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore dependency manifest
        shell: bash
        run: cp other/hmm.json hmm.json

      - name: Prepare optional example mod
        shell: bash
        run: |
          if [[ ! -f example_mods/mod-example.zip ]]; then
            mkdir -p example_mods "$RUNNER_TEMP/mod-example"
            printf 'The full LuaSlice example mod is included with desktop releases.\n' > "$RUNNER_TEMP/mod-example/README.txt"
            ditto -c -k "$RUNNER_TEMP/mod-example" example_mods/mod-example.zip
          fi

      - name: Setup Haxe and dependencies
        uses: ./.github/actions/setup-haxe
        with:
          targets: ios
          gh-token: ${{ github.token }}

      - name: Setup HXCPP tools
        shell: bash
        run: |
          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Rebuild Lime for iOS Simulator
        shell: bash
        run: haxelib run lime rebuild ios -simulator -release

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set +e
          mkdir -p BuildLogs/ios
          LOG="BuildLogs/ios/log-iosbuild-$(date +%Y-%m-%d-%H-%M-%S).txt"
          haxelib run lime build ios -simulator -release -DGITHUB_BUILD 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          echo "Build Log located at: $LOG" | tee -a "$LOG"
          exit "$STATUS"

      - name: Package Simulator app
        shell: bash
        run: |
          APP_PATH="$(find export/release/ios -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" LuaSlice-iOS-Simulator.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: LuaSlice-iOS-Simulator
          path: LuaSlice-iOS-Simulator.zip
          if-no-files-found: error

      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuaSlice-iOS-Build-Logs
          path: BuildLogs/ios/*.txt
          if-no-files-found: warn

      - name: Rebuild Lime for physical iPhone
        shell: bash
        run: haxelib run lime rebuild ios -release -arm64

      - name: Build unsigned physical iPhone app
        shell: bash
        run: |
          set +e
          mkdir -p BuildLogs/ios
          LOG="BuildLogs/ios/log-ios-device-$(date +%Y-%m-%d-%H-%M-%S).txt"
          haxelib run lime build ios -release -arm64 -nosign -DGITHUB_BUILD 2>&1 | tee "$LOG"
          APP_PATH="$(find export/release/ios -type d -path '*Release-iphoneos/*.app' -print -quit)"
          echo "Build Log located at: $LOG" | tee -a "$LOG"
          test -n "$APP_PATH"

      - name: Package unsigned physical iPhone IPA
        shell: bash
        run: |
          APP_PATH="$(find export/release/ios -type d -path '*Release-iphoneos/*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"
          rm -rf Payload LuaSlice-iOS-Unsigned.ipa
          mkdir Payload
          ditto "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          zip -qry LuaSlice-iOS-Unsigned.ipa Payload

      - name: Upload physical iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuaSlice-iOS-Unsigned-IPA
          path: LuaSlice-iOS-Unsigned.ipa
          if-no-files-found: error

      - name: Upload physical iPhone build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LuaSlice-iOS-Device-Build-Logs
          path: BuildLogs/ios/log-ios-device-*.txt
          if-no-files-found: warn
